<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration • La Zone 2Keh</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09090f;color:#f6f4ff;font:15px Arial}.box{width:min(390px,90vw);padding:32px;background:#151421;border:1px solid #302b46;border-radius:18px}h1{font-size:23px}p{color:#aaa}input,button{width:100%;padding:13px;border-radius:9px;margin-top:12px;box-sizing:border-box}input{background:#0b0b14;border:1px solid #38334e;color:white}button{border:0;background:#9068ed;color:white;font-weight:bold;cursor:pointer}.error{color:#ff9db2}</style></head><body><form class="box" method="post"><h1>Administration</h1><p>La Zone 2Keh • Accès réservé</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<p class="{{category}}">{{message}}</p>{% endfor %}{% endwith %}<input type="password" name="password" placeholder="Mot de passe administrateur" required><button>Se connecter</button></form></body></html>
